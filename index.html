<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Glow-Up OS</title>
<meta name="description" content="Your personal operating system for consistency, not perfection." />
<meta name="theme-color" content="#6250e0" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0f0e1a" media="(prefers-color-scheme: dark)" />
<meta name="color-scheme" content="light dark" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Glow-Up" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="./icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<link rel="stylesheet" href="./styles.css" />
<style>
  .skip-link { position: absolute; left: 8px; top: -60px; z-index: 200; padding: 10px 14px; border-radius: 10px; background: #6250e0; color: #fff; font: 600 14px system-ui, sans-serif; text-decoration: none; }
  .skip-link:focus { top: 8px; }
</style>
</head>
<body>
  <a class="skip-link" href="#main-content" onclick="document.getElementById('main-content').focus()">Skip to content</a>
  <div id="app-shell">
    <nav id="sidebar" class="sidebar" aria-label="Main navigation">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span class="brand-text">Glow-Up OS</span>
      </div>
      <div id="nav-links" class="nav-links"></div>
      <button id="theme-toggle" class="theme-toggle" title="Toggle theme" aria-label="Toggle light/dark theme">🌙</button>
    </nav>

    <main id="main-content" class="main-content" role="main"></main>

    <nav id="bottom-nav" class="bottom-nav" aria-label="Mobile navigation"></nav>
  </div>

  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="false"></div>

  <noscript><p style="padding:24px;font-family:system-ui,sans-serif">Glow-Up OS needs JavaScript enabled to run.</p></noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
